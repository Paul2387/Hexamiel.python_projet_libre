{% extends 'front/base.html' %}
{% block content %}



<main class="">
    <h1 class="">publier un nouveau type miel</h1>
    <form methode="POST" action = "{{url_for('create_miel')}}" enctype = 'multipart/from-data'>
        <!---nom-->
        <div>
            <label>Nom</label>
            <input type = "text" name = "nom" required placeholder="nom du miel">

        </div>

        <!--image---> 
        <div>
            <label>image</label>
            <input type="file" name = "image" accept = "image/*">
        </div>

        <!--description---> 

        <div>
            <label>description</label>
            <textarea name = "description" rows = "4" required placeholder="descrtption de votre miel(type, texture...)"></textarea>
        </div>

        <!--tags---> 
        <div>
            <label>choisir les Tags : </label>
            <div>
                {%for tag in tags%}
                <input type="checkbox" id="{{ tag }}" name ="tags" value="{{ tag }}" class="">
                <label for="{{ tag }}" class="">{{ tag }}</label>
                {% endfor %}
            </div>

        </div>

        <!--prix---> 


        <!--button-->
        <button type = "submit" > publier</button>

     </form>


</main>





{%endblock%}
